<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bordo 3D"></head><body>
<title>Bordo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: piano di costruzione navale — barra in alto, foglio (vista dall'alto, di fianco o 3D) e pannello del pezzo selezionato; archivio delle barche come schedario */
:root{
  --bg:#ECF0EF; --board:#F5F7F6; --sheet:#FBFCFC; --ink:#13232B; --ink-2:#4C5F68; --ink-3:#7D8E95;
  --rule:#C8D2D3; --grid:#DEE5E5; --grid-2:#C3CFD0; --hull:#FFFFFF; --hull-line:#13232B;
  --accent:#0E7490; --accent-ink:#FFFFFF; --accent-soft:#D2E9EF;
  --ov:#9B2C24; --ov-soft:#F1D9D5; --el:#D9480F; --id:#2563EB; --wood:#C9A77C;
  --warn:#A65F00; --warn-soft:#F6E6CB; --bad:#BC3A26; --bad-soft:#F5D9D3; --ok:#2B7A4D; --ok-soft:#D7EEDF;
  --font-d:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-ui:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow:0 1px 2px rgb(19 35 43 / .08), 0 8px 24px rgb(19 35 43 / .10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417; --board:#121B1F; --sheet:#172126; --ink:#E1E9E8; --ink-2:#98A9AF; --ink-3:#6B7C83;
    --rule:#28363C; --grid:#18232A; --grid-2:#28363C; --hull:#1E2A30; --hull-line:#C9D6D5;
    --accent:#4FB6CF; --accent-ink:#06171C; --accent-soft:#163A44;
    --ov:#E0705F; --ov-soft:#3D1F1A; --el:#FF8A4C; --id:#78A6FF; --wood:#B08D62;
    --warn:#E2A443; --warn-soft:#3A2C12; --bad:#F2826D; --bad-soft:#3E1F19; --ok:#74C896; --ok-soft:#173A26;
    --shadow:0 1px 2px rgb(0 0 0 / .45), 0 10px 28px rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --board:#121B1F; --sheet:#172126; --ink:#E1E9E8; --ink-2:#98A9AF; --ink-3:#6B7C83;
  --rule:#28363C; --grid:#18232A; --grid-2:#28363C; --hull:#1E2A30; --hull-line:#C9D6D5;
  --accent:#4FB6CF; --accent-ink:#06171C; --accent-soft:#163A44;
  --ov:#E0705F; --ov-soft:#3D1F1A; --el:#FF8A4C; --id:#78A6FF; --wood:#B08D62;
  --warn:#E2A443; --warn-soft:#3A2C12; --bad:#F2826D; --bad-soft:#3E1F19; --ok:#74C896; --ok-soft:#173A26;
  --shadow:0 1px 2px rgb(0 0 0 / .45), 0 10px 28px rgb(0 0 0 / .4);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;max-width:1700px;margin-inline:auto}

/* barra */
.bar{display:flex;align-items:center;gap:8px;min-height:42px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mark{flex:none;width:34px;height:34px;color:var(--ink)}
.brand-text{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.brand-sub{font-family:var(--font-d);font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.brand-name{font-family:var(--font-d);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;flex:none;background:var(--board);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-family:var(--font-d);font-weight:600;font-size:15px;padding:5px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;cursor:pointer;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.status{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:0 12px;height:38px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-s="saved"] .dot{background:var(--ok)}
.status[data-s="dirty"] .dot,.status[data-s="ro"] .dot{background:var(--warn)}
.status[data-s="error"] .dot{background:var(--bad)}
.status[data-s="saving"] .dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:600px){.brand-text{display:none}.status{padding:0 10px}.status span:last-child{display:none}}
@media (max-width:380px){#redo{display:none}.seg button{padding:5px 9px}}
@media (max-width:420px){#redo{display:none}.bar{gap:6px}.bar .gd-btn{width:32px}}

/* archivio */
.archive{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.arch-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.arch-head h1{margin:0;font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1.05;text-wrap:balance}
.arch-head p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.arch-tools{display:flex;gap:8px;flex-wrap:wrap}
.search{height:42px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:0 12px;min-width:0;width:220px;max-width:100%;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:var(--accent)}
.card-hull{height:84px;background:var(--board);border-bottom:1px solid var(--rule);display:block;width:100%}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-name{font-family:var(--font-d);font-weight:700;font-size:20px;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-model{color:var(--ink-2);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-num);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;letter-spacing:.03em;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.ex{background:var(--warn-soft)}
.arch-empty{border:1.5px dashed var(--rule);border-radius:14px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--sheet)}
.arch-empty p{margin:0;max-width:46ch;color:var(--ink-2)}
.settings{border:1px solid var(--rule);border-radius:14px;background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.settings summary{cursor:pointer;font-family:var(--font-d);font-weight:600;font-size:17px}

/* area di lavoro */
.work{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;flex:1 1 56%;min-height:220px;border:1px solid var(--rule);border-radius:14px;background:var(--board);overflow:hidden}
#plan,#view3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#view3d{cursor:grab}
.panel{position:relative;flex:0 1 44%;min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.panel.collapsed{flex:0 0 auto}
.panel.collapsed #pc{display:none}
.grip{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:28px;border:0;border-bottom:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--ink-3);font-size:12px;font-weight:600}
.grip i{display:block;width:36px;height:4px;border-radius:4px;background:var(--grid-2)}
#pc{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
@media (min-width:880px){
  .work{flex-direction:row}
  .stage{flex:1 1 auto;min-height:0}
  .panel{flex:0 0 390px;width:390px}
  .grip{display:none}
  .panel.collapsed #pc{display:block}
}
.tools{position:absolute;display:flex;gap:6px;z-index:2}
.tools-r{top:10px;right:10px;flex-direction:column}
.tools-l{top:10px;left:10px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.tool{min-height:36px;min-width:36px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.tool.icon{padding:0;width:36px}
.tool svg{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pop{position:absolute;top:56px;left:10px;z-index:4;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:230px;max-width:calc(100% - 20px)}
.pop h4{margin:0;font-family:var(--font-d);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.scalebar{position:absolute;left:12px;bottom:10px;z-index:2;font-family:var(--font-num);font-size:11px;color:var(--ink-2);pointer-events:none;display:flex;flex-direction:column;gap:3px}
.scalebar .bars{display:flex;height:6px;border:1px solid var(--ink)}
.scalebar .bars i{display:block;height:100%}
.scalebar .bars i:nth-child(odd){background:var(--ink)}
.scalebar .lab{display:flex;justify-content:space-between}
.viewlbl{position:absolute;right:56px;bottom:10px;z-index:2;font-family:var(--font-d);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);pointer-events:none}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;width:min(94%,460px);background:var(--sheet);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hint p{margin:0;font-size:14px}
.hint .step{font-family:var(--font-d);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.banner-top{position:absolute;left:10px;right:10px;top:56px;z-index:3;background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.glfail{position:absolute;inset:auto 12px 12px 12px;z-index:3;background:var(--bad-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.hint3d{position:absolute;left:12px;bottom:10px;right:12px;z-index:2;font-size:12px;color:var(--ink-2);pointer-events:none}

/* pannello */
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:none;padding:12px 9px 10px;font-family:var(--font-d);font-size:16px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtab{border:1px solid var(--rule);background:var(--board);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pb{padding:14px 16px 22px;display:flex;flex-direction:column;gap:12px}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px}
.tile{text-align:left;border:1px solid var(--rule);background:var(--board);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:50px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:13.5px;font-weight:600;line-height:1.25}
.tile span{font-family:var(--font-num);font-size:11px;color:var(--ink-2)}
.tile i{font-style:normal;display:inline-block;min-width:22px;text-align:center;border-radius:5px;font-family:var(--font-num);font-size:10.5px;font-weight:600;padding:1px 4px;margin-right:4px;color:#fff}
.tile i.el{background:var(--el)}
.tile i.id{background:var(--id)}
.cta{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer}
.cta svg{flex:none;width:28px;height:28px;color:var(--accent)}
.cta b{display:block;font-size:15px}
.cta small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:17px;height:17px;flex:none}
.btn.sm{min-height:34px;font-size:13px;padding:0 11px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 40%, var(--rule))}
.btn.danger.armed{background:var(--bad);color:var(--sheet);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.row-btns>.btn{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:8px}
.ai{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--board);border:1px solid var(--rule)}
.ai.busy span::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.voce{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:45;width:min(calc(100% - 24px),460px);background:var(--sheet);border:1px solid var(--accent);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.voce .said{font-size:16px;font-weight:600;min-height:22px}
.voce .said.wait{color:var(--ink-3);font-weight:500}
.voce ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.voce textarea{width:100%;min-height:60px;border:1px solid var(--rule);border-radius:9px;background:var(--board);color:var(--ink);font:inherit;font-size:16px;padding:8px 10px;resize:vertical}
.voce .live::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:8px;animation:pulse 1s infinite}
.voce .note.bad{color:var(--bad)}
.banner{border:1px solid var(--rule);background:var(--board);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.banner p{margin:0;font-size:13.5px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.note{margin:0;font-size:12.5px;color:var(--ink-2)}
.note.warn{color:var(--warn)}
.note.bad{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.flab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{position:relative}
.num input,.text,.select,textarea.text{width:100%;height:42px;border:1px solid var(--rule);border-radius:9px;background:var(--board);color:var(--ink);font-size:16px;padding:0 10px}
textarea.text{height:auto;min-height:70px;padding:8px 10px;resize:vertical;font-weight:400}
.num input{font-family:var(--font-num);font-weight:500;padding-right:36px;font-variant-numeric:tabular-nums}
.num::after{content:attr(data-unit);position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--font-num);font-size:11.5px;color:var(--ink-3);pointer-events:none}
.num.nounit input{padding-right:10px}
.text{font-weight:500}
.ed-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1}
.ed-kind{flex:1;min-width:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ed-kind b{color:var(--ink);letter-spacing:0;text-transform:none;font-family:var(--font-d);font-size:18px;font-weight:700;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rot .val{font-family:var(--font-num);font-size:14px;min-width:46px;text-align:center}
.colors{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.colors input[type=color]{width:42px;height:36px;border:1px solid var(--rule);border-radius:8px;background:var(--board);padding:2px;cursor:pointer}
.photo{display:flex;gap:12px;align-items:flex-start}
.photo img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--rule);background:var(--board);flex:none}
.photo .stack{flex:1;min-width:0}
.check{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.share{display:grid;gap:8px;margin:4px 0 8px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:var(--board);padding:10px 12px;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow b{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lrow span{font-family:var(--font-num);font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow .flag{font-family:var(--font-ui);font-weight:700;font-size:11px;border-radius:999px;padding:1px 7px}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.w{background:var(--warn-soft);color:var(--warn)}
.flag.b{background:var(--bad-soft);color:var(--bad)}
.dot-el,.dot-id{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
.dot-el{background:var(--el)}
.dot-id{background:var(--id)}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);align-items:baseline}
.sum b{font-family:var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum.big b{font-size:18px}

function uiState() { return { boat: S.boat ? S.boat.id : null, view: S.view, tab: S.tab, sub: S.sub }; }
function saveUI() { try { sessionStorage.setItem('bordo3d-ui', JSON.stringify(uiState())); } catch (e) {} }
function readUI() { try { return JSON.parse(sessionStorage.getItem('bordo3d-ui') || 'null'); } catch (e) { return null; } }
window.addEventListener('pagehide', saveUI);
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveUI(); if (S.dirty) saveNow(); } });
async function start(hotData) {
  const ui = hotData && hotData.tab ? hotData : readUI();
  renderArchive();
  await Store.init();
  if (caps.db && caps.db.segnaVecchie) caps.db.segnaVecchie('bordo'); // l'amministratore segna «di tutti» le barche di prima
  S.impostazioni = await Store.getSettings();
  setStatus(S.readOnly ? 'ro' : S.mode === 'local' ? 'local' : 'saved');
  let first = true;
  Store.watchIndex(list => {
    S.boats = (list || []).filter(x => x && x.id);
    if (first && S.mode === 'local' && !S.boats.length && !S.readOnly) { first = false; const ex = makeExample(); ex.aggiornato = new Date().toISOString(); Store.saveBoat(ex); return; }
    first = false; if (S.screen === 'archive') renderArchive();
  });
  if (ui) { if (ui.tab) S.tab = ui.tab; if (ui.sub) S.sub = ui.sub; if (ui.view) S.view = ui.view; if (ui.boat) openBoat(ui.boat); }
  try { new ResizeObserver(() => { if (S.screen !== 'work') return; if (S.view === '3d') resize3D(); else requestDraw(); }).observe(stage); } catch (e) {}
  const onTheme = () => { requestDraw(); if (T3.ok) { T3.dirty = true; render3D(); } };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme); } catch (e) {}
  try { new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => uiState()); } catch (e) {}
if (hot && typeof hot.ready === 'function') { try { hot.ready(start); } catch (e) { start({}); } } else start((hot && hot.data) || {});
})();
</script>
