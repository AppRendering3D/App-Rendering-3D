<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App 3D</title>
<meta name="theme-color" content="#F6F4EF">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="App 3D">
<style>
:root{--b:#F6F4EF;--s:#FFFFFF;--t:#1F2328;--t2:#5B6270;--l:#DCD8CF;--a:#1D6FD8;--w:#B4561F}
@media (prefers-color-scheme:dark){:root{--b:#141619;--s:#1E2126;--t:#EEF0F3;--t2:#A3AAB6;--l:#30343B;--a:#6FA8FF;--w:#F0A46C}}
*{box-sizing:border-box}
body{margin:0;background:var(--b);color:var(--t);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 32px) 16px 40px}
h1{font-size:1.8rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--t2);margin:0 0 24px}
.app{display:flex;align-items:center;gap:14px;background:var(--s);border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none}
.app:active{transform:scale(.99)}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--b);color:var(--a)}
.ic svg{width:30px;height:30px}
.app b{display:block;font-size:1.08rem}
.app span{color:var(--t2);font-size:.92rem}
h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin:28px 4px 8px}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px 16px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.pill{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--w);color:#fff}
.none{color:var(--t2);background:var(--s);border:1px dashed var(--l);border-radius:14px;padding:16px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>window.FB3D_APP = ''; window.FB3D_HOME = './';</script>
<script src="fb3d.js"></script>
</head>
<body>
<main>
  <h1>App 3D</h1>
  <p class="sub" id="hello">Progetti in 3D di case e barche</p>
  <div id="apps"></div>
  <h4 id="acctH">Account</h4>
  <div id="acct"></div>
</main>
<script>
(function () {
  var ICONS = {
    casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
    bordo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M12 4l6 9h-6"/><path d="M3 17h18l-2.5 4h-13z"/></svg>'
  };
  var TXT = { casa: 'Pianta, arredi, impianti e vista 3D di una casa', bordo: 'Archivio barche: carena 3D, interni, impianti, preventivi' };
  var F = window.__FB3D;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function render() {
    var me = F.me(); if (!me) return;
    document.getElementById('hello').textContent = me.nome ? 'Ciao ' + me.nome + ', scegli un’app' : 'Scegli un’app';
    var h = me.app.map(function (a) {
      return '<a class="app" href="' + a + '/"><div class="ic">' + ICONS[a] + '</div><div><b>' + esc(F.apps[a]) + '</b><span>' + esc(TXT[a]) + '</span></div></a>';
    }).join('');
    document.getElementById('apps').innerHTML = h || '<div class="none">Nessuna app ancora: un amministratore deve sceglierle per te.</div>';
    if (F.libera) { document.getElementById('acctH').hidden = true; return; }
    var n = F.pending();
    document.getElementById('acct').innerHTML = (me.admin ? '<button class="row" data-k="utenti"><span>Persone e permessi</span>' + (n ? '<span class="pill">' + n + ' in attesa</span>' : '') + '</button>' : '') +
      '<button class="row" data-k="account"><span>Il mio account</span><span style="color:var(--t2);font-size:.9rem">' + esc(me.email) + '</span></button>';
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) F.open(b.getAttribute('data-k')); });
  F.ready.then(function () { render(); F.onUsers(render); });
})();
</script>
</body>
</html>
