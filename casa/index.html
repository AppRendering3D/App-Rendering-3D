<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Casa 3D"></head><body>
<title>Casa Nuova 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tavolo da disegno — barra in alto, foglio di lavoro (pianta o 3D) e pannello del pezzo selezionato: sotto su telefono, a destra su schermo largo */
:root{
  --paper:#ECEFED; --board:#F5F7F6; --sheet:#FBFCFB; --ink:#1C272C; --ink-2:#536167; --ink-3:#7F8C92;
  --rule:#CBD3D1; --grid:#E1E6E4; --grid-2:#CBD3D1; --floor:#E2E8E5; --wall:#1C272C; --ground:#D3D9D6;
  --accent:#2A49C9; --accent-ink:#FFFFFF; --accent-soft:#D9E0FA;
  --warn:#A65F00; --warn-soft:#F6E6CB; --bad:#BC3A26; --bad-soft:#F5D9D3; --ok:#2B7A4D; --elec:#D9480F; --water:#1D6FD8;
  --font-ui:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow:0 1px 2px rgb(28 39 44 / .08), 0 8px 24px rgb(28 39 44 / .10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1416; --board:#141A1D; --sheet:#182024; --ink:#E2E9E7; --ink-2:#9AA8AD; --ink-3:#6E7C82;
    --rule:#2A353A; --grid:#1B2326; --grid-2:#2A353A; --floor:#1B2428; --wall:#C9D4D2; --ground:#1C2427;
    --accent:#93A7FF; --accent-ink:#0B1026; --accent-soft:#222E5A;
    --warn:#E2A443; --warn-soft:#3A2C12; --bad:#F2826D; --bad-soft:#3E1F19; --ok:#74C896; --elec:#FF8A4C; --water:#6FA8FF;
    --shadow:0 1px 2px rgb(0 0 0 / .45), 0 10px 28px rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1416; --board:#141A1D; --sheet:#182024; --ink:#E2E9E7; --ink-2:#9AA8AD; --ink-3:#6E7C82;
  --rule:#2A353A; --grid:#1B2326; --grid-2:#2A353A; --floor:#1B2428; --wall:#C9D4D2; --ground:#1C2427;
  --accent:#93A7FF; --accent-ink:#0B1026; --accent-soft:#222E5A;
  --warn:#E2A443; --warn-soft:#3A2C12; --bad:#F2826D; --bad-soft:#3E1F19; --ok:#74C896; --elec:#FF8A4C; --water:#6FA8FF;
  --shadow:0 1px 2px rgb(0 0 0 / .45), 0 10px 28px rgb(0 0 0 / .4);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 12px;max-width:1680px;margin-inline:auto}

/* barra */
.bar{display:flex;align-items:center;gap:8px;min-height:42px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mark{flex:none;width:30px;height:30px;color:var(--ink)}
.brand-text{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-weight:700;font-stretch:115%;font-size:16.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.seg{display:inline-flex;flex:none;background:var(--board);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:650;font-size:14px;padding:6px 13px;border-radius:999px;cursor:pointer;min-height:32px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.icon-btn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;cursor:pointer;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.status{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:0 12px;height:38px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-s="saved"] .dot{background:var(--ok)}
.status[data-s="dirty"] .dot{background:var(--warn)}
.status[data-s="error"] .dot{background:var(--bad)}
.status[data-s="saving"] .dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:520px){.brand-text{display:none}.status{padding:0 10px}}
@media (max-width:370px){#redo{display:none}}

/* area di lavoro */
.work{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;flex:1 1 56%;min-height:220px;border:1px solid var(--rule);border-radius:14px;background:var(--board);overflow:hidden}
#plan,#view3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#view3d{cursor:grab}
.panel{position:relative;flex:0 1 44%;min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.panel.collapsed{flex:0 0 auto}
.panel.collapsed #pc{display:none}
.grip{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:28px;border:0;border-bottom:1px solid var(--rule);background:var(--sheet);cursor:pointer;color:var(--ink-3);font-size:12px;font-weight:600}
.grip i{display:block;width:36px;height:4px;border-radius:4px;background:var(--grid-2)}
#pc{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
@media (min-width:860px){
  .work{flex-direction:row}
  .stage{flex:1 1 auto;min-height:0}
  .panel{flex:0 0 372px;width:372px}
  .grip{display:none}
  .panel.collapsed #pc{display:block}
}

/* strumenti sul foglio */
.tools{position:absolute;display:flex;gap:6px;z-index:2}
.tools-2d{top:10px;right:10px;flex-direction:column}
.tools-3d{top:10px;left:10px;right:10px;flex-wrap:wrap;align-items:flex-start}
.tool{min-height:36px;min-width:36px;padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.tool.icon{padding:0;width:36px}
.tool svg{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool select{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--ink);padding:0 2px;height:34px;max-width:46vw;cursor:pointer}
.tool select:focus-visible{outline:none}
.scalebar{position:absolute;left:12px;bottom:10px;z-index:2;font-family:var(--font-num);font-size:11px;color:var(--ink-2);pointer-events:none;display:flex;flex-direction:column;gap:3px}
.scalebar .bars{display:flex;height:6px;border:1px solid var(--ink)}
.scalebar .bars i{display:block;height:100%}
.scalebar .bars i:nth-child(odd){background:var(--ink)}
.scalebar .lab{display:flex;justify-content:space-between}
.hint3d{position:absolute;left:12px;bottom:10px;right:12px;z-index:2;font-size:12px;color:var(--ink-2);pointer-events:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;width:min(92%,420px);background:var(--sheet);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hint p{margin:0;font-size:14px}
.hint.low{top:auto;bottom:10px}
.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:2;padding:20px;pointer-events:none}
.empty>div{pointer-events:auto;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.empty p{margin:0}
.glfail{position:absolute;inset:auto 12px 12px 12px;z-index:3;background:var(--bad-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}

/* pannello */
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:none;padding:12px 10px 10px;font-size:14px;font-weight:650;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pb{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.cat-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.tile{text-align:left;border:1px solid var(--rule);background:var(--board);border-radius:10px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:54px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:13.5px;font-weight:650;line-height:1.25}
.tile span{font-family:var(--font-num);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cta{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer}
.cta svg{flex:none;width:28px;height:28px;color:var(--accent)}
.cta b{display:block;font-size:15px}
.cta small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:17px;height:17px;flex:none}
.btn.sm{min-height:34px;font-size:13px;padding:0 11px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 40%, var(--rule))}
.btn.danger.armed{background:var(--bad);color:var(--sheet);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.row-btns>.btn{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:8px}
.banner{border:1px solid var(--rule);background:var(--board);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.banner p{margin:0;font-size:13.5px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.note{margin:0;font-size:12.5px;color:var(--ink-2)}
.note.warn{color:var(--warn)}
.note.bad{color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.num{position:relative}
.num input,.text,.select{width:100%;height:42px;border:1px solid var(--rule);border-radius:9px;background:var(--board);color:var(--ink);font-size:16px;padding:0 10px}
.num input{font-family:var(--font-num);font-weight:500;padding-right:34px;font-variant-numeric:tabular-nums}
.num::after{content:attr(data-unit);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font-num);font-size:12px;color:var(--ink-3);pointer-events:none}
.text{font-weight:600}
.ed-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet);z-index:1}
.ed-kind{flex:1;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ed-kind b{color:var(--ink);letter-spacing:0;text-transform:none;font-size:15px;font-weight:700;display:block;margin-top:1px}
.rot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rot .val{font-family:var(--font-num);font-size:14px;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.colors{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.colors input[type=color]{width:42px;height:36px;border:1px solid var(--rule);border-radius:8px;background:var(--board);padding:2px;cursor:pointer}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.clear{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.clear div{border:1px solid var(--rule);border-radius:9px;padding:6px 8px;background:var(--board)}
.clear span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.clear b{font-family:var(--font-num);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.clear .w{border-color:var(--warn);background:var(--warn-soft)}
.clear .w b{color:var(--warn)}
.photo{display:flex;gap:12px;align-items:flex-start}
.photo img{width:116px;height:116px;object-fit:cover;border-radius:10px;border:1px solid var(--rule);background:var(--board);flex:none}
.photo .stack{flex:1;min-width:0}
.check{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ai{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--board);border:1px solid var(--rule)}
.ai.done{border-color:var(--ok)}
.ai.err{border-color:var(--bad)}
.ai.busy span::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.lrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:var(--board);padding:11px 13px;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow b{font-weight:650;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow span{font-family:var(--font-num);font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2)}
.sum b{font-family:var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums}
.plan-thumb{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--board);max-height:160px;display:grid;place-items:center}
.plan-thumb img{max-height:160px;width:auto;display:block}
input[type=range]{width:100%;accent-color:var(--accent)}
.copybox{width:100%;height:96px;font-family:var(--font-num);font-size:12px;border:1px solid var(--rule);border-radius:9px;background:var(--board);color:var(--ink);padding:8px;resize:vertical}
.howto{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.kbd{font-family:var(--font-num);font-size:12px}

/* pianta (SVG) */
.gl{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.gl2{stroke:var(--grid-2);stroke-width:1;vector-effect:non-scaling-stroke}
.floor{fill:var(--floor)}
.floor.sel{fill:var(--accent-soft)}
.room-out{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
.wall{fill:var(--wall)}
.cut{fill:var(--floor);stroke:none}
.ib{stroke:var(--ink);stroke-width:1.25;vector-effect:non-scaling-stroke;fill-opacity:.82}
.ib.dash{stroke-dasharray:5 4;fill-opacity:.35}
.ib.rug{stroke-dasharray:3 3;fill-opacity:.4}
.ib.mw{fill:var(--wall);fill-opacity:1;stroke:var(--wall)}
.el{fill:var(--elec);stroke:var(--sheet);stroke-width:1;vector-effect:non-scaling-stroke}
.el.q{fill:var(--sheet);stroke:var(--elec);stroke-width:2}
.item.sel .el{stroke:var(--accent);stroke-width:3}
.tr{stroke:var(--elec);stroke-width:2.2;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
.item.sel .tr{stroke:var(--accent)}
.elbl{font-family:var(--font-num);font-weight:600;fill:var(--elec);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--board);stroke-linejoin:round}
.il{fill:none;stroke:var(--ink);stroke-width:.9;vector-effect:non-scaling-stroke;opacity:.75}
.il.thin{opacity:.45}
.il.dash{stroke-dasharray:4 4}
.op .il{opacity:1}
.item{cursor:grab}
.item.sel .ib{stroke:var(--accent);stroke-width:2.6}
.item.sel.op .il{stroke:var(--accent)}
.item.bad .ib{stroke:var(--bad);stroke-width:2.2;stroke-dasharray:5 3}
.lbl{font-family:var(--font-num);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--board);stroke-linejoin:round}
.rlbl{font-family:var(--font-ui);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--floor);stroke-linejoin:round}
.rmeta{font-family:var(--font-num);fill:var(--ink-2);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--floor);stroke-linejoin:round}
.dim line,.dim path{stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke;fill:none}
.dim text{fill:var(--accent);font-family:var(--font-num);font-weight:600;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--board);stroke-linejoin:round}
.dim.w line,.dim.w path{stroke:var(--warn)}
.dim.w text{fill:var(--warn)}
.handle{fill:var(--sheet);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;cursor:nwse-resize}
.cal{fill:var(--accent)}
.cal-l{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 4}

/* impianto idraulico, non forare, metro, livelli */
.el.w{fill:var(--water)}
.tr.w{stroke:var(--water)}
.elbl.w{fill:var(--water)}
.cover{fill:none;stroke:var(--bad);stroke-width:2.6;vector-effect:non-scaling-stroke}
.item.nf .ib{stroke:var(--warn);stroke-width:2.4;stroke-dasharray:6 3}
.mt line,.mt path{stroke:var(--accent);stroke-width:1.8;vector-effect:non-scaling-stroke;fill:none}
.mt circle{fill:var(--accent);stroke:var(--sheet);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mt text{fill:var(--accent);font-family:var(--font-num);font-weight:600;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--board);stroke-linejoin:round}
.pop{position:absolute;top:56px;left:10px;z-index:4;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:250px;max-width:calc(100% - 20px);max-height:calc(100% - 66px);overflow:auto}
.pop h4{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--rule);background:var(--board);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.nf-box ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.idea{display:flex;flex-direction:column;gap:6px;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--board)}
.idea textarea{width:100%;min-height:58px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;font-size:15px;padding:7px 9px;resize:vertical}
.idea .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.measure{font-family:var(--font-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{z-index:60}

.fv-title span{font-size:12.5px;color:var(--ink-2);font-family:var(--font-num)}

.ov-canvas{position:relative;flex:1 1 52%;min-height:220px;border:1px solid var(--rule);border-radius:12px;background:var(--board);overflow:hidden;touch-action:none}

/* Ogni faccia di parete ha una pila di foto, una per fase (tracce, impianti, intonaco…).

  let obj; try { obj = JSON.parse(await file.text()); } catch (er) { toast('Questo file non è una copia del progetto'); return; }
  if (asNew && SITE) {
    const prj = obj && obj.progetto ? obj.progetto : obj;
    if (!isProject(prj)) { toast('Questa non è una copia del progetto'); return; }
    const id = await newCasa(true); if (id) importObject(obj);
    return;
  }
  importObject(obj);
});
async function importObject(obj) {
  const prj = obj && obj.progetto ? obj.progetto : obj;
  if (!isProject(prj)) { toast('Questa non è una copia del progetto'); return false; }
  for (const pth of usedPaths()) markRemoved(pth);
  const fresh = normalize(prj), map = {};
  const fotos = obj.foto && typeof obj.foto === 'object' ? obj.foto : {};
  for (const [old, du] of Object.entries(fotos)) {
    if (typeof du !== 'string' || !du.startsWith('data:image/')) continue;
    try { const b = await dataURLToBlob(du), np = 'foto/' + uid() + '.jpg'; S.photos.set(np, b); S.pending.add(np); IDB.put('blobs', np, b); map[old] = np; } catch (er) {}
  }
  fresh.arredi.forEach(i => { if (i.foto && map[i.foto]) i.foto = map[i.foto]; });
  if (fresh.planimetria && map[fresh.planimetria.src]) fresh.planimetria.src = map[fresh.planimetria.src];
  fresh.fogli.forEach(f => { if (map[f.src]) f.src = map[f.src]; if (f.foto && map[f.foto]) f.foto = map[f.foto]; });
  S.project = fresh; S.sel = null; S.calib = null; S.pasteOpen = false; renderHint(); changed(); fitView(); T.framed = false; if (S.view === '3d') { frame3D(); T.framed = true; } renderPanel(true);
  toast('Copia importata');
  return true;
}

/* tastiera (computer) */
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (S.fv) { if (e.key === 'Escape') { if (S.fv.rc) { S.fv.rc = null; renderFogli(); } else closeFogli(); } return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); travel(e.shiftKey ? 1 : -1); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); travel(1); return; }
  const sel = selected();
  if (!sel) { if (e.key === 'Escape' && S.metroOn) setMetro(false); return; }
  if (e.key === 'Escape') { if (S.metroOn) setMetro(false); else select(null); return; }
  if (sel.k !== 'item') return;
  const it = sel.o, st = e.shiftKey ? 10 : 1;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); P().arredi = P().arredi.filter(i => i !== it); select(null); changed(); toast('Eliminato'); return; }
  if (e.key.toLowerCase() === 'r') { it.rot = norm(it.rot + (e.shiftKey ? -90 : 90)); if (OPENINGS.has(it.t)) snapOpening(it); changed(); syncFields(it); return; }
  const mv = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
  if (mv) { e.preventDefault(); it.x += mv[0]; it.y += mv[1]; syncFields(it); changed(); }
});

/* ================= toast ================= */
let toastT = 0;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2800); }

/* ================= avvio ================= */
function useDraft(d) {
  S.project = normalize(d.project); S.dirty = true;
  (d.pending || []).forEach(k => S.pending.add(k)); (d.removed || []).forEach(k => S.removed.add(k));
}
async function loadPendingBlobs() {
  for (const k of S.pending) if (!S.photos.has(k)) { const b = await IDB.get('blobs', k); if (b) S.photos.set(k, b); }
}
function uiState() { return { view: S.view, tab: S.tab, sel: S.sel, vp: S.vp, walls: S.walls }; }
function saveUI() { try { sessionStorage.setItem('casa3d-ui', JSON.stringify(uiState())); } catch (e) {} }
function readUI() { try { return JSON.parse(sessionStorage.getItem('casa3d-ui') || 'null'); } catch (e) { return null; } }
window.addEventListener('pagehide', saveUI);
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveUI(); if (S.dirty && !S.readOnly) publishNow(); } });

async function start(hotData) {
  const ui = hotData && hotData.vp ? hotData : readUI();
  renderPanel(true);
  if (SITE) { startSite(ui); return; }
  let remote = null;
  try { const r = await fetch('progetto.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (isProject(j)) remote = j; } } catch (e) {}
  let draft = null; try { draft = await IDB.get('kv', 'draft'); } catch (e) {}
  await enter(remote, draft, ui);
  setupOnce();
}
async function enter(remote, draft, ui) {
  S.hadRemote = !!remote; S.baseUpdated = remote ? (remote.aggiornato || null) : null;
  if (draft && draft.dirty && draft.project && isProject(draft.project)) {
    if (!remote || (draft.baseUpdated || null) === S.baseUpdated) useDraft(draft);
    else { S.project = normalize(remote); S.conflict = draft; }
  } else S.project = normalize(remote || makeExample());
  await loadPendingBlobs();
  if (S.conflict) for (const k of S.conflict.pending || []) { const b = await IDB.get('blobs', k); if (b) S.photos.set(k, b); }
  resetHistory();
  $('#projName').textContent = P().nome; updElecBtns();
  if (ui) {
    if (ui.tab) S.tab = ui.tab; if (ui.walls) S.walls = ui.walls;
    if (ui.sel && (ui.sel.k === 'item' ? itemById(ui.sel.id) : roomById(ui.sel.id))) S.sel = ui.sel;
  }
  setStatus(S.dirty ? 'dirty' : remote ? 'saved' : 'local');
  if (!remote) S.readOnly = false;
  renderPanel(true);
  if (ui && ui.vp && ui.vp.s) { S.vp = ui.vp; requestDraw(); } else fitView();
  if (ui && ui.view === '3d') setView('3d'); else requestDraw();
  if (S.dirty && !S.readOnly && remote) schedulePublish(6000);
}
function setupOnce() {
  try { new ResizeObserver(() => { if (S.view === '3d') resize3D(); else requestDraw(); }).observe(stage); } catch (e) { window.addEventListener('resize', () => { if (S.view === '3d') resize3D(); else requestDraw(); }); }
  const onTheme = () => { requestDraw(); if (T.ok) { T.dirty = true; render3D(); } };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme); } catch (e) {}
  try { new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
}

/* ================= sito proprio: apri, crea, chiudi ed elimina le case ================= */
function showArch(on) { $('#arch').hidden = !on; $('#btnArch').hidden = !SITE || on; if (on) renderArch(); }
function renderArch() {
  if ($('#arch').hidden) return;
  const fmt = t => { try { return new Date(t).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
  let h = `<div class="arch-top"><div><h1>Le tue case</h1><p class="note">Ogni casa ha la sua pianta, i suoi arredi e i suoi impianti. Tocca una casa per aprirla.</p></div><a class="btn" href="${esc(window.__FB3D.home)}">Home</a></div>
    <div class="arch-actions"><button class="btn primary" data-act="newCasa">Nuova casa da planimetria</button><button class="btn" data-act="importCasa">Importa una copia (file)</button></div>`;
  if (S.cases === undefined) h += `<p class="note">Apro l’archivio…</p>`;
  else if (S.cases === null) h += `<div class="arch-empty">Non riesco a leggere l’archivio. Controlla la connessione e riapri la pagina.</div>`;
  else if (!S.cases.length) h += `<div class="arch-empty"><b>L’archivio è vuoto.</b> Crea la prima casa partendo dalla planimetria, oppure importa la copia esportata da Casa Nuova 3D su Claude (Progetto › Esporta copia).</div>`;
  else h += S.cases.slice().sort((a, b) => String(b.aggiornato || '').localeCompare(String(a.aggiornato || ''))).map(c =>
    `<button class="arch-card" data-act="openCasa" data-id="${esc(c.id)}"><b>${esc(c.nome || 'Casa')}</b><span>${c.stanze || 0} ${c.stanze === 1 ? 'stanza' : 'stanze'} · ${c.arredi || 0} elementi${c.aggiornato ? ' · aggiornata il ' + fmt(c.aggiornato) : ''}</span></button>`).join('');
  $('#archIn').innerHTML = h;
}
async function startSite(ui) {
  if (!S.project) { S.project = emptyProject(); resetHistory(); }
  setupOnce();
  showArch(true);
  try { await Cloud.init(); } catch (e) { S.cases = null; renderArch(); return; }
  let first = true;
  Cloud.watchIndex(list => {
    S.cases = list ? list.filter(x => x && x.id) : null; renderArch();
    if (first && S.cases) {
      first = false;
      let last = null; try { last = sessionStorage.getItem('casa3d-open'); } catch (e) {}
      if (last && S.cases.some(c => c.id === last)) openCasa(last, ui);
    }
  });
}
function resetForOpen() {
  clearTimeout(pubT); clearTimeout(draftT);
  if (S.metroOn) setMetro(false);
  S.sel = null; S.calib = null; S.armed = null; S.conflict = null; S.pasteOpen = false;
  if (S.fv) { S.fv = null; fvEl.hidden = true; fvEl.innerHTML = ''; }
  S.pending.clear(); S.removed.clear(); S.gone.clear();
  S.dirty = false; S.retried = false; S.readOnly = false; S.editSeq++;
  T.framed = false; renderHint();
}
async function openCasa(id, ui) {
  resetForOpen(); S.casaId = id; S.tab = 'arredi';
  try { sessionStorage.setItem('casa3d-open', id); } catch (e) {}
  showArch(false); setStatus('loading');
  let remote = null; try { remote = await Cloud.load(id); } catch (e) {}
  if (S.casaId !== id) return;
  if (!remote) { toast('Non riesco ad aprire questa casa'); S.casaId = null; showArch(true); return; }
  let draft = null; try { draft = await IDB.get('kv', 'draft:' + id); } catch (e) {}
  await enter(remote, draft, ui && ui.vp ? ui : null);
  if (!P().stanze.length && !P().planimetria) S.tab = 'pianta';
  for (const pth of usedPaths(true)) if (!S.photos.has(pth) && !pth.startsWith('foto/cat-')) await photoBlob(pth);
  if (S.casaId !== id) return;
  T.dirty = true; requestDraw(); request3D(); renderPanel(true);
}
async function closeCasa() {
  if (!S.casaId) { showArch(true); return; }
  const id = S.casaId;
  while (publishing) await new Promise(r => setTimeout(r, 200));
  if (S.casaId === id && S.dirty && !S.readOnly) await publishNow();
  if (S.casaId !== id) return;
  resetForOpen(); S.casaId = null;
  try { sessionStorage.removeItem('casa3d-open'); } catch (e) {}
  if (S.view === '3d') setView('plan');
  showArch(true);
}
async function newCasa(quiet) {
  if (S.casaId) await closeCasa();
  const n = (S.cases || []).length, p = emptyProject(n ? 'Casa ' + (n + 1) : 'Casa nuova');
  p.aggiornato = new Date().toISOString();
  const id = uid();
  try { await Cloud.save(id, p); } catch (e) { toast('Non riesco a creare la casa: controlla la connessione'); return null; }
  await openCasa(id);
  if (!quiet) toast('Casa nuova: carica la planimetria, poi cambia il nome da Progetto');
  return id;
}
async function delCasa() {
  const id = S.casaId; if (!id) return;
  resetForOpen(); S.casaId = null;
  try { sessionStorage.removeItem('casa3d-open'); } catch (e) {}
  showArch(true);
  while (publishing) await new Promise(r => setTimeout(r, 200));
  try { await Cloud.remove(id); toast('Casa eliminata'); } catch (e) { toast('Eliminazione non riuscita: riprova'); }
}

const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => uiState()); } catch (e) {}
if (hot && typeof hot.ready === 'function') { try { hot.ready(start); } catch (e) { start({}); } } else start((hot && hot.data) || {});
})();
</script>
